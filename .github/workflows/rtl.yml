name: True RTL guard

on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'scripts/check-rtl.mjs'
      - 'docs/RTL_POLICY.md'
      - 'CLAUDE.md'
      - 'DESIGN.md'
      - 'package.json'
      - '.github/workflows/rtl.yml'
  push:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'scripts/check-rtl.mjs'
      - 'docs/RTL_POLICY.md'
      - 'CLAUDE.md'
      - 'DESIGN.md'
      - 'package.json'
      - '.github/workflows/rtl.yml'

jobs:
  rtl:
    name: Enforce True RTL contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new UI against base branch
        if: github.event_name == 'pull_request'
        run: node scripts/check-rtl.mjs --base ${{ github.event.pull_request.base.sha }}
      - name: Check pushed UI against previous commit
        if: github.event_name == 'push'
        run: node scripts/check-rtl.mjs --base ${{ github.event.before }}
